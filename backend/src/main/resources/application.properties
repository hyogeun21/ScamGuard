spring.application.name=backend
# PostgreSQL ?? ??
spring.datasource.url=jdbc:postgresql://localhost:5432/scamguard
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA ??
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
scamguard.seed.job-enabled=false
scamguard.seed.side-enabled=false

# Claude AI feedback
scamguard.ai.enabled=${SCAMGUARD_AI_ENABLED:false}
scamguard.ai.api-key=${ANTHROPIC_API_KEY:}
scamguard.ai.model=${ANTHROPIC_MODEL:claude-sonnet-5}
scamguard.ai.timeout=${SCAMGUARD_AI_TIMEOUT:20s}
